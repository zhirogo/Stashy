# Stashy 展示站自动部署到 GitHub Pages
# 每次推送到 main 分支时自动构建并发布
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 准备数据文件
        # 个人数据 data/resources.json 不进入仓库，这里用示例数据生成
        run: cp data/resources.example.json data/resources.json

      - name: 构建展示站
        run: npm run build
        env:
          # 站点部署在项目页，BASE_PATH 必须与仓库名大小写一致
          # （仓库名 Stashy → /Stashy/，仓库名 stashy → /stashy/）
          BASE_PATH: /Stashy/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
